name: Build S3D Smart Calendar V4.0.2

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify project structure
        run: |
          test -f platformio.ini
          test -f src/main.cpp
          echo "Project structure OK"
          ls -la
          ls -la src

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install "platformio==6.1.18"
          pio --version

      - name: Build firmware
        run: |
          pio run -e esp32dev

      - name: Prepare firmware package
        run: |
          set -e
          mkdir -p release

          test -f .pio/build/esp32dev/bootloader.bin
          test -f .pio/build/esp32dev/partitions.bin
          test -f .pio/build/esp32dev/firmware.bin

          cp .pio/build/esp32dev/bootloader.bin release/bootloader.bin
          cp .pio/build/esp32dev/partitions.bin release/partitions.bin
          cp .pio/build/esp32dev/firmware.bin release/firmware.bin

          BOOT_APP="$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin"
          if [ -f "$BOOT_APP" ]; then
            cp "$BOOT_APP" release/boot_app0.bin
          fi

          cat > release/FLASH_OFFSETS.txt <<'EOF'
          S3D Smart Calendar V4.0.2

          bootloader.bin   0x1000
          partitions.bin  0x8000
          boot_app0.bin    0xE000
          firmware.bin     0x10000
          EOF

          echo "Release contents:"
          ls -lh release

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: S3D_SmartCalendar_V4_0_2_Firmware
          path: release/
          if-no-files-found: error
          retention-days: 30
